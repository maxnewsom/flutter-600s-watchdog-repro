apiVersion: v1alpha
kind: xctest
sauce:
  region: us-west-1
  concurrency: 1
xctest:
  app: ./build/ios_integ/Build/Products/Runner.ipa
  xcTestRunFile: ./build/ios_integ/Build/Products/Runner_iphoneos26.5-arm64.xctestrun
suites:
  - name: "600s repro - 6 sequential native tests (result every 2 min)"
    shard: concurrency
    #numShards: 2
    devices:
      - name: ".*"
artifacts:
  download:
    when: always
    match:
      - "*.*"
    directory: ./repro-600s-sequential-artifacts
