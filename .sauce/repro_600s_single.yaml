apiVersion: v1alpha
kind: xctest
sauce:
  region: us-west-1
  concurrency: 1
xctest:
  app: ./build/ios_integ/Build/Products/Runner.ipa
  xcTestRunFile: ./build/ios_integ/Build/Products/Runner_iphoneos26.5-arm64.xctestrun
suites:
  - name: "600s repro - single long test (one result at the end)"
    devices:
      - name: ".*"
artifacts:
  download:
    when: always
    match:
      - "*.*"
    directory: ./repro-600s-single-artifacts
